name: ci

# The gate battery, on GitHub-hosted runners: this repo is going
# public, and fork PRs must never execute on self-hosted
# machines.
# Kumbarium is pure cross-platform Rust and portability is the
# end goal, so clippy + tests run natively on all three OSes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    # OS-independent; run once. Nightly rustfmt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: >
          rustup toolchain install nightly -c rustfmt
          --profile minimal
      - run: cargo +nightly fmt --all --check

  lints:
    # The Python gates + licenses: OS-independent, run once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/width_gate.py
      - run: python3 scripts/no_scaffolding.py
      - run: python3 scripts/cargo_hygiene.py
      - name: licenses (cargo-deny, if installed)
        run: python3 scripts/license_gate.py

  gate:
    # clippy + tests per OS, natively.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: >
          rustup toolchain install stable -c clippy
          --profile minimal
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
