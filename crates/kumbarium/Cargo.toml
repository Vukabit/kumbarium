# The binary: the MCP stdio server (D-014) + CLI.

[package]
name = "kumbarium"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# `kum` (src/bin/kum.rs) is the short alias: it includes
# src/main.rs as a module and calls run(), so every install
# channel ships both names with zero shell config.

[dependencies]
kumbarium-audit = { path = "../kumbarium-audit" }
kumbarium-janitor = { path = "../kumbarium-janitor" }
kumbarium-librarian = { path = "../kumbarium-librarian" }
kumbarium-store = { path = "../kumbarium-store" }
kumbarium-util = { path = "../kumbarium-util" }
directories.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# The golden-eval runner (tests/golden_evals.rs) + importer
# fixture dirs.
serde.workspace = true
tempfile.workspace = true
toml.workspace = true
