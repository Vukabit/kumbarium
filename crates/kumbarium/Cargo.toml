# The binary: CLI today; MCP server + wiring as v0.1 lands. Deps
# stay limited to what main.rs actually uses; the kumbarium-*
# crates join as the server wires up.

[package]
name = "kumbarium"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
directories.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The golden-eval runner (tests/golden_evals.rs) drives store +
# librarian together, the way the MCP server will.
kumbarium-librarian = { path = "../kumbarium-librarian" }
kumbarium-store = { path = "../kumbarium-store" }
serde.workspace = true
toml.workspace = true
