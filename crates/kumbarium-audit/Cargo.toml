# The witness: audit event types and the append-only audit db.
# Separate crate ON PURPOSE: audit code cannot reach the memory db
# (no kumbarium-store dependency; the compiler enforces it).

[package]
name = "kumbarium-audit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kumbarium-util = { path = "../kumbarium-util" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
