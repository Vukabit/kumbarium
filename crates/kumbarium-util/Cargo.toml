# The vendored utility floor (time/id/fs/lock/hash).
# Deliberately a self-contained COPY with no upstream: it
# diverges freely, and fixes are ported by hand when they
# apply.

[package]
name = "kumbarium-util"
version = "0.3.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
uuid.workspace = true
tempfile.workspace = true
fd-lock.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
proptest.workspace = true
