# cargo-deny policy (run: cargo deny check, or the gate's
# license_gate.py). Kumbarium is MIT OR Apache-2.0; [licenses]
# allowlists permissive licenses compatible with that. Copyleft
# (GPL / AGPL / LGPL / SSPL / MPL / ...) is absent from the list,
# so it FAILS the gate and adding one is a deliberate review,
# never an accident.

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
]
# Per-crate overrides after review (an ambiguous SPDX field or a
# deliberately-accepted weak-copyleft dep). MPL-2.0 example from
# [redacted]'s precedent: option-ext (transitive via directories ->
# dirs-sys) is a tiny helper used UNMODIFIED, so MPL file-level
# copyleft never reaches this code (MPL-2.0 sec 3.3). Scoped to
# the one crate, never a blanket allow.
exceptions = [{ name = "option-ext", allow = ["MPL-2.0"] }]

[licenses.private]
# publish = false workspace crates carry the workspace license;
# skip them.
ignore = true

[bans]
# Multiple resolved versions of one crate: bloat signal, warn.
multiple-versions = "warn"
# A wildcard version on a registry crate is a supply-chain smell.
# Intra-workspace path deps carry an implicit `*` and are fine.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
